[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patcherly-connector"
version = "2.2.3"
description = "Patcherly detects bugs in real time in your app.  It creates a customized AI patch, and once you approve it, backs up your code, fixes it & tests the patch for you. If anything is off, it rolls back the changes automatically, or you can always roll it back in a click. Website: https://patcherly.com · Docs: https://help.patcherly.com/connectors/python/"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
authors = [{ name = "Patcherly", email = "support@patcherly.com" }]

[project.scripts]
patcherly = "patcherly_cli:main"

[project.urls]
Homepage = "https://patcherly.com"
Documentation = "https://help.patcherly.com/connectors/python/"
Repository = "https://github.com/Patcherly-Official/patcherly-connector-packages"
Issues = "https://github.com/Patcherly-Official/patcherly-connector-packages/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.setuptools]
py-modules = [
    "backup_manager",
    "context_collector",
    "credential_store",
    "oauth_client",
    "patch_applicator",
    "patcherly_cli",
    "python_agent",
    "queue_manager",
    "sanitizer",
]
