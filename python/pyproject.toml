[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patcherly-connector"
version = "2.2.1"
description = "Patcherly Python connector — monitors logs and applies approved fixes via OAuth."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
authors = [{ name = "Patcherly", email = "support@patcherly.com" }]

[project.scripts]
patcherly = "patcherly_cli:main"

[project.urls]
Homepage = "https://patcherly.com"
Repository = "https://github.com/Patcherly-Official/patcherly-connector-packages"
Documentation = "https://help.patcherly.com/connectors/python/"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.setuptools]
py-modules = [
    "backup_manager",
    "context_collector",
    "credential_store",
    "oauth_client",
    "patch_applicator",
    "patcherly_cli",
    "python_agent",
    "queue_manager",
    "sanitizer",
]
