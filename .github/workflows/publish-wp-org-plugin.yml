# SPDX-License-Identifier: MIT
name: Publish WordPress.org plugin

# Runs on Patcherly-Official/patcherly-connector-packages (flat layout: patcherly/,
# nodejs/, …). Synced from the app monorepo — paths must match that public repo.
#
# WordPress.org SVN is a release repo of individual files — never upload a zip
# (Plugin Handbook: Using Subversion). This job stages the same file set that
# patcherly.zip would contain from main/patcherly/, puts screenshot/banner/icon
# into /assets, syncs /trunk, then svn cp trunk → tags/<version>.

on:
  workflow_dispatch:
    inputs:
      release_ver:
        description: Connector RELEASE_VER to publish (e.g. 2.5.1)
        required: true
        type: string
      connector_tree_changed:
        description: Set false when connectors/patcherly/ unchanged in push range
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      connector_ci_passed:
        description: Set false when Connectors CI job for this tree failed
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

env:
  PLUGIN_SLUG: patcherly
  SVN_URL: https://plugins.svn.wordpress.org/patcherly

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.ENABLE_WP_ORG_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Determine whether to publish
        id: gate
        env:
          CONNECTOR_CI_PASSED: ${{ inputs.connector_ci_passed }}
          CONNECTOR_TREE_CHANGED: ${{ inputs.connector_tree_changed }}
        run: |
          set -euo pipefail
          if [ "$CONNECTOR_CI_PASSED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — Connectors CI did not pass for patcherly"
            exit 0
          fi
          if [ "$CONNECTOR_TREE_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — connectors/patcherly/ unchanged in push range"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "✅ Will stage patcherly/ → WordPress.org SVN trunk/tags/assets"

      - name: Stage trunk + assets (zip-equivalent excludes)
        if: steps.gate.outputs.skip != 'true'
        env:
          RELEASE_VER: ${{ inputs.release_ver }}
        run: |
          set -euo pipefail
          test -d patcherly
          test -f .github/scripts/stage_wp_org_svn.py
          python3 .github/scripts/stage_wp_org_svn.py \
            --src patcherly \
            --trunk-out "${RUNNER_TEMP}/wp-org/trunk" \
            --assets-out "${RUNNER_TEMP}/wp-org/assets" \
            --version "${RELEASE_VER}"

      - name: Verify staged tree matches zip manifest contract
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Build a temporary zip with the same arc layout as release patcherly.zip
          # (patcherly/<file>) so existing verify-zip-manifest.php can gate the SVN payload.
          STAGE="${RUNNER_TEMP}/wp-org"
          VERIFY_ROOT="${RUNNER_TEMP}/wp-org-verify"
          rm -rf "$VERIFY_ROOT"
          mkdir -p "$VERIFY_ROOT/patcherly"
          cp -a "${STAGE}/trunk/." "$VERIFY_ROOT/patcherly/"
          (
            cd "$VERIFY_ROOT"
            zip -qr "${RUNNER_TEMP}/patcherly-svn-stage.zip" patcherly
          )
          php patcherly/tests/verify-zip-manifest.php "${RUNNER_TEMP}/patcherly-svn-stage.zip"
          echo "✅ Staged trunk matches boot-manifest zip contract"

      - name: Deploy to WordPress.org SVN
        if: steps.gate.outputs.skip != 'true'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          RELEASE_VER: ${{ inputs.release_ver }}
        run: |
          set -euo pipefail
          if [ -z "${SVN_USERNAME:-}" ] || [ -z "${SVN_PASSWORD:-}" ]; then
            echo "::error::SVN_USERNAME and SVN_PASSWORD required for WordPress.org deploy"
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion

          STAGE="${RUNNER_TEMP}/wp-org"
          SVN_DIR="${RUNNER_TEMP}/svn-${PLUGIN_SLUG}"
          rm -rf "$SVN_DIR"

          # Shallow checkout: only trunk + assets + tags metadata (handbook layout).
          svn checkout --depth immediates \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            --non-interactive --no-auth-cache \
            "$SVN_URL" "$SVN_DIR"
          svn update --set-depth infinity \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            --non-interactive --no-auth-cache \
            "$SVN_DIR/trunk" "$SVN_DIR/assets"
          svn update --set-depth immediates \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            --non-interactive --no-auth-cache \
            "$SVN_DIR/tags"

          if [ -d "$SVN_DIR/tags/${RELEASE_VER}" ]; then
            echo "::error::SVN tags/${RELEASE_VER} already exists — refuse to rewrite a released tag"
            exit 1
          fi

          # Sync staged files into trunk/assets (delete removed plugin files from trunk).
          rsync -a --delete \
            --exclude='.svn' \
            "${STAGE}/trunk/" "$SVN_DIR/trunk/"
          mkdir -p "$SVN_DIR/assets"
          rsync -a \
            --exclude='.svn' \
            "${STAGE}/assets/" "$SVN_DIR/assets/"

          cd "$SVN_DIR"

          # Schedule adds / deletes for SVN.
          # Missing from working copy → svn delete; unversioned → svn add.
          while IFS= read -r path; do
            svn delete --force "$path"
          done < <(svn status | awk '/^!/ {print substr($0,9)}')
          while IFS= read -r path; do
            svn add --force "$path"
          done < <(svn status | awk '/^\?/ {print substr($0,9)}')

          # Handbook: create tags from trunk via svn copy (not a manual file dump).
          svn copy "trunk" "tags/${RELEASE_VER}"

          svn status
          svn commit \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            --non-interactive --no-auth-cache \
            -m "Release ${RELEASE_VER}"

          echo "✅ Published ${PLUGIN_SLUG} ${RELEASE_VER} to WordPress.org SVN (trunk + tags/${RELEASE_VER} + assets)"
