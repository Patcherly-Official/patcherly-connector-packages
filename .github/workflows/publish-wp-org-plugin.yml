# SPDX-License-Identifier: MIT
name: Publish WordPress.org plugin

# Runs on Patcherly-Official/patcherly-connector-packages (flat layout: patcherly/,
# nodejs/, …). Synced from the app monorepo — paths must match that public repo,
# not connectors/... Monorepo already builds + uploads patcherly.zip to the
# GitHub Release; this job downloads that asset and deploys to WordPress.org.

on:
  workflow_dispatch:
    inputs:
      release_ver:
        description: Connector RELEASE_VER to publish (e.g. 2.2.1)
        required: true
        type: string
      connector_tree_changed:
        description: Set false when connectors/patcherly/ unchanged in push range
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      connector_ci_passed:
        description: Set false when Connectors CI job for this tree failed
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.ENABLE_WP_ORG_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Determine whether to publish
        id: gate
        env:
          CONNECTOR_CI_PASSED: ${{ inputs.connector_ci_passed }}
          CONNECTOR_TREE_CHANGED: ${{ inputs.connector_tree_changed }}
        run: |
          set -euo pipefail
          if [ "$CONNECTOR_CI_PASSED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — Connectors CI did not pass for patcherly"
            exit 0
          fi
          if [ "$CONNECTOR_TREE_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — connectors/patcherly/ unchanged in push range"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "✅ Will deploy patcherly.zip for WordPress.org"
      - name: Download release zip and verify manifest
        if: steps.gate.outputs.skip != 'true'
        env:
          RELEASE_VER: ${{ inputs.release_ver }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Registry / connector patch is often X.Y.Z while the GitHub Release tag stays on the
          # app-line vX.Y.0 (assets are clobbered onto that tag). Prefer exact tag, else Latest.
          if gh release view "v${RELEASE_VER}" >/dev/null 2>&1; then
            TAG="v${RELEASE_VER}"
          else
            TAG="$(gh release view --json tagName --jq .tagName)"
            echo "::warning::No release tag v${RELEASE_VER}; downloading patcherly.zip from ${TAG}"
          fi
          gh release download "$TAG" --pattern 'patcherly.zip' --clobber
          test -f patcherly.zip
          php patcherly/tests/verify-zip-manifest.php patcherly.zip
          echo "✅ Verified patcherly.zip from ${TAG} (requested connector ver ${RELEASE_VER})"
      - name: Deploy to WordPress.org SVN
        if: steps.gate.outputs.skip != 'true'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          RELEASE_VER: ${{ inputs.release_ver }}
        run: |
          set -euo pipefail
          if [ -z "${SVN_USERNAME:-}" ] || [ -z "${SVN_PASSWORD:-}" ]; then
            echo "::error::SVN_USERNAME and SVN_PASSWORD required for WordPress.org deploy"
            exit 1
          fi
          echo "::warning::SVN deploy steps are operator-configured — extract patcherly.zip to trunk/tags manually until SVN checkout is wired."
