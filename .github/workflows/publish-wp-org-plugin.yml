# SPDX-License-Identifier: MIT
name: Publish WordPress.org plugin

# Runs on Patcherly-Official/patcherly-connector-packages (flat layout: patcherly/,
# nodejs/, …). Synced from the app monorepo — paths must match that public repo.
#
# WordPress.org SVN (Plugin Handbook — Using Subversion):
#   /assets  — banners/icons/screenshots — managed MANUALLY (CI never touches)
#   /trunk   — always the latest plugin files (= patcherly.zip contents)
#   /tags/X  — frozen copy of version X
#
# Per release:
#   1) Snapshot existing trunk → tags/<current_trunk_ver> if that tag is missing
#      (preserves the previous release before wipe)
#   2) rsync --delete staged files into trunk (removes stale SVN files)
#   3) svn cp trunk → tags/<RELEASE_VER> (Stable Tag target for this release)
#
# Stable Tag in trunk/readme.txt MUST be the version number (e.g. 2.5.1), NOT
# "trunk". WP.org serves downloads from /tags/<Stable Tag>/; "Stable Tag: trunk"
# is discouraged and blocked for new plugins.

on:
  workflow_dispatch:
    inputs:
      release_ver:
        description: Connector RELEASE_VER to publish (e.g. 2.5.1)
        required: true
        type: string
      connector_tree_changed:
        description: Set false when connectors/patcherly/ unchanged in push range
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      connector_ci_passed:
        description: Set false when Connectors CI job for this tree failed
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

env:
  PLUGIN_SLUG: patcherly
  SVN_URL: https://plugins.svn.wordpress.org/patcherly

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.ENABLE_WP_ORG_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Determine whether to publish
        id: gate
        env:
          CONNECTOR_CI_PASSED: ${{ inputs.connector_ci_passed }}
          CONNECTOR_TREE_CHANGED: ${{ inputs.connector_tree_changed }}
        run: |
          set -euo pipefail
          if [ "$CONNECTOR_CI_PASSED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — Connectors CI did not pass for patcherly"
            exit 0
          fi
          if [ "$CONNECTOR_TREE_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — connectors/patcherly/ unchanged in push range"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "✅ Will publish patcherly/ → SVN trunk + tags/${{ inputs.release_ver }}"

      - name: Stage trunk (zip-equivalent excludes)
        if: steps.gate.outputs.skip != 'true'
        env:
          RELEASE_VER: ${{ inputs.release_ver }}
        run: |
          set -euo pipefail
          test -d patcherly
          test -f .github/scripts/stage_wp_org_svn.py
          python3 .github/scripts/stage_wp_org_svn.py \
            --src patcherly \
            --trunk-out "${RUNNER_TEMP}/wp-org/trunk" \
            --version "${RELEASE_VER}"

      - name: Verify staged tree matches zip manifest contract
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/wp-org"
          VERIFY_ROOT="${RUNNER_TEMP}/wp-org-verify"
          rm -rf "$VERIFY_ROOT"
          mkdir -p "$VERIFY_ROOT/patcherly"
          cp -a "${STAGE}/trunk/." "$VERIFY_ROOT/patcherly/"
          (
            cd "$VERIFY_ROOT"
            zip -qr "${RUNNER_TEMP}/patcherly-svn-stage.zip" patcherly
          )
          php patcherly/tests/verify-zip-manifest.php "${RUNNER_TEMP}/patcherly-svn-stage.zip"
          echo "✅ Staged trunk matches boot-manifest zip contract"

      - name: Deploy to WordPress.org SVN (snapshot old trunk → wipe trunk → tag new)
        if: steps.gate.outputs.skip != 'true'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          RELEASE_VER: ${{ inputs.release_ver }}
        run: |
          set -euo pipefail
          if [ -z "${SVN_USERNAME:-}" ] || [ -z "${SVN_PASSWORD:-}" ]; then
            echo "::error::SVN_USERNAME and SVN_PASSWORD required for WordPress.org deploy"
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion

          STAGE="${RUNNER_TEMP}/wp-org"
          SVN_DIR="${RUNNER_TEMP}/svn-${PLUGIN_SLUG}"
          rm -rf "$SVN_DIR"

          svn_auth=(--username "$SVN_USERNAME" --password "$SVN_PASSWORD" --non-interactive --no-auth-cache)

          # Checkout trunk + tags only — never update /assets (manual marketing assets).
          svn checkout --depth immediates "${svn_auth[@]}" "$SVN_URL" "$SVN_DIR"
          svn update --set-depth infinity "${svn_auth[@]}" "$SVN_DIR/trunk"
          svn update --set-depth immediates "${svn_auth[@]}" "$SVN_DIR/tags"

          if [ -d "$SVN_DIR/tags/${RELEASE_VER}" ]; then
            echo "::error::SVN tags/${RELEASE_VER} already exists — refuse to rewrite a released tag"
            exit 1
          fi

          cd "$SVN_DIR"

          # --- Step 1: snapshot pre-existing trunk into tags/<old_ver> if needed ---
          OLD_VER=""
          if [ -f trunk/patcherly.php ]; then
            OLD_VER="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' trunk/patcherly.php | head -1 | tr -d '\r' | awk '{print $1}')"
          fi
          if [ -z "$OLD_VER" ] && [ -f trunk/readme.txt ]; then
            OLD_VER="$(sed -n 's/^Stable tag:[[:space:]]*//Ip' trunk/readme.txt | head -1 | tr -d '\r' | awk '{print $1}')"
          fi
          if [ -n "$OLD_VER" ] && [ "$OLD_VER" != "trunk" ] && [ "$OLD_VER" != "$RELEASE_VER" ]; then
            if [ -d "tags/${OLD_VER}" ]; then
              echo "ℹ️ tags/${OLD_VER} already exists — skipping pre-wipe snapshot"
            else
              echo "📦 Snapshotting current trunk → tags/${OLD_VER} (before wipe)"
              svn copy trunk "tags/${OLD_VER}"
            fi
          else
            echo "ℹ️ No prior trunk version to snapshot (empty trunk, trunk Stable Tag, or same as RELEASE_VER)"
          fi

          # --- Step 2: wipe + replace trunk with latest zip-equivalent files ---
          # rsync --delete removes stale files that are no longer in the staged tree.
          rsync -a --delete \
            --exclude='.svn' \
            "${STAGE}/trunk/" "$SVN_DIR/trunk/"

          while IFS= read -r path; do
            svn delete --force "$path"
          done < <(svn status | awk '/^!/ {print substr($0,9)}')
          while IFS= read -r path; do
            svn add --force "$path"
          done < <(svn status | awk '/^\?/ {print substr($0,9)}')

          # --- Step 3: tag the NEW release (Stable Tag target) ---
          # Handbook: create tags from trunk via svn copy after trunk is updated.
          svn copy trunk "tags/${RELEASE_VER}"

          svn status
          svn commit "${svn_auth[@]}" \
            -m "Release ${RELEASE_VER}: snapshot prior trunk if needed; replace trunk; tag ${RELEASE_VER}"

          echo "✅ Published ${PLUGIN_SLUG} ${RELEASE_VER}"
          echo "   trunk = latest (zip-equivalent)"
          echo "   tags/${RELEASE_VER} = frozen release (Stable Tag target)"
          echo "   /assets = untouched (manual)"
