# SPDX-License-Identifier: MIT
name: Publish PyPI connector

on:
  workflow_dispatch:
    inputs:
      release_ver:
        description: Connector RELEASE_VER to publish (e.g. 2.2.1)
        required: true
        type: string
      connectors_changed:
        description: >-
          Deprecated alias for connector_tree_changed (kept for manual reruns).
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      connector_tree_changed:
        description: >-
          Set false when update-release-latest found no changes under
          connectors/python/ in the push range.
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Determine whether to publish
        id: gate
        run: |
          set -euo pipefail
          TREE_CHANGED="${{ inputs.connector_tree_changed }}"
          if [ "${{ inputs.connectors_changed }}" != "true" ]; then
            TREE_CHANGED="false"
          fi
          if [ "$TREE_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — connectors/python/ unchanged in push range"
            exit 0
          fi
          VER="${{ inputs.release_ver }}"
          if curl -fsS "https://pypi.org/pypi/patcherly-connector/${VER}/json" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ patcherly-connector ${VER} already on PyPI — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Will publish patcherly-connector ${VER} to PyPI"
          fi
      - name: Build and check
        if: steps.gate.outputs.skip != 'true'
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
