# SPDX-License-Identifier: MIT
name: Publish npm connector

on:
  workflow_dispatch:
    inputs:
      release_ver:
        description: Connector RELEASE_VER to publish (e.g. 2.2.1)
        required: true
        type: string
      connectors_changed:
        description: >-
          Deprecated alias for connector_tree_changed (kept for manual reruns).
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      connector_tree_changed:
        description: Set false when connectors/nodejs/ unchanged in push range
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      connector_ci_passed:
        description: Set false when Connectors CI job for this tree failed
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.ENABLE_NPM_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm (OIDC requires >= 11.5.1)
        run: |
          npm install -g npm@latest
          # libnpmpublish resolves sigstore from npm's own node_modules when
          # provenance is enabled (id-token: write). GHA Node 24 bundles omit it.
          npm install sigstore --prefix "$(npm root -g)/npm"
      - name: Determine whether to publish
        id: gate
        env:
          CONNECTOR_CI_PASSED: ${{ inputs.connector_ci_passed }}
          CONNECTOR_TREE_CHANGED: ${{ inputs.connector_tree_changed }}
          CONNECTORS_CHANGED: ${{ inputs.connectors_changed }}
          RELEASE_VER: ${{ inputs.release_ver }}
        run: |
          set -euo pipefail
          if [ "$CONNECTOR_CI_PASSED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — Connectors CI did not pass for nodejs"
            exit 0
          fi
          TREE_CHANGED="$CONNECTOR_TREE_CHANGED"
          if [ "$CONNECTORS_CHANGED" != "true" ]; then
            TREE_CHANGED="false"
          fi
          if [ "$TREE_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — connectors/nodejs/ unchanged in push range"
            exit 0
          fi
          VER="$RELEASE_VER"
          if npm view "@patcherly/nodejs-connector@${VER}" version 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Version ${VER} already on npm — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Will publish @patcherly/nodejs-connector@${VER}"
          fi
      - name: Publish to npm
        if: steps.gate.outputs.skip != 'true'
        working-directory: nodejs
        run: |
          npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts
          npm publish --access public
