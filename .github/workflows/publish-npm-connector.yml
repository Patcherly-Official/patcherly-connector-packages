# SPDX-License-Identifier: MIT
name: Publish npm connector

on:
  workflow_dispatch:
    inputs:
      release_ver:
        description: Connector RELEASE_VER to publish (e.g. 2.2.1)
        required: true
        type: string
      connectors_changed:
        description: >-
          Deprecated alias for connector_tree_changed (kept for manual reruns).
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      connector_tree_changed:
        description: >-
          Set false when update-release-latest found no changes under
          connectors/nodejs/ in the push range.
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.ENABLE_NPM_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm (OIDC requires >= 11.5.1)
        run: npm install -g npm@latest
      - name: Determine whether to publish
        id: gate
        run: |
          set -euo pipefail
          TREE_CHANGED="${{ inputs.connector_tree_changed }}"
          if [ "${{ inputs.connectors_changed }}" != "true" ]; then
            TREE_CHANGED="false"
          fi
          if [ "$TREE_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — connectors/nodejs/ unchanged in push range"
            exit 0
          fi
          VER="${{ inputs.release_ver }}"
          if npm view "@patcherly/nodejs-connector@${VER}" version 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Version ${VER} already on npm — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Will publish @patcherly/nodejs-connector@${VER}"
          fi
      - name: Publish to npm
        if: steps.gate.outputs.skip != 'true'
        working-directory: nodejs
        run: |
          npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts
          npm publish --access public
