# SPDX-License-Identifier: MIT
name: Publish Packagist connector

on:
  workflow_dispatch:
    inputs:
      release_ver:
        description: Connector RELEASE_VER to publish (e.g. 2.2.1)
        required: true
        type: string
      connectors_changed:
        description: >-
          Deprecated alias for connector_tree_changed (kept for manual reruns).
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      connector_tree_changed:
        description: Set false when connectors/php/ unchanged in push range
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      connector_ci_passed:
        description: Set false when Connectors CI job for this tree failed
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.ENABLE_PACKAGIST_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate composer.json
        working-directory: php
        run: composer validate --strict --no-check-publish
      - name: Determine whether to publish
        id: gate
        env:
          GH_TOKEN: ${{ secrets.PATCHERLY_RELEASES_TOKEN }}
          RELEASE_VER: ${{ inputs.release_ver }}
          CONNECTOR_CI_PASSED: ${{ inputs.connector_ci_passed }}
          CONNECTOR_TREE_CHANGED: ${{ inputs.connector_tree_changed }}
          CONNECTORS_CHANGED: ${{ inputs.connectors_changed }}
        run: |
          set -euo pipefail
          if [ "$CONNECTOR_CI_PASSED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — Connectors CI did not pass for php"
            exit 0
          fi
          TREE_CHANGED="$CONNECTOR_TREE_CHANGED"
          if [ "$CONNECTORS_CHANGED" != "true" ]; then
            TREE_CHANGED="false"
          fi
          if [ "$TREE_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping — connectors/php/ unchanged in push range"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PATCHERLY_RELEASES_TOKEN required to inspect Patcherly-Official/php-connector"
            exit 1
          fi
          TAG="v${RELEASE_VER}"
          PHP_REPO="Patcherly-Official/php-connector"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${PHP_REPO}.git"
          TMP=$(mktemp -d)
          if git ls-remote --tags "$REMOTE" "refs/tags/${TAG}" | grep -q .; then
            # Packagist ships runtime only — tests stay in connector-packages php/ for CI.
            rsync -a --delete --exclude=tests/ "$GITHUB_WORKSPACE/php/" "$TMP/local-tree/"
            git clone --depth 1 "$REMOTE" "$TMP/repo"
            cd "$TMP/repo"
            git fetch --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
            mkdir -p "$TMP/tag-tree"
            git archive "$TAG" | tar -x -C "$TMP/tag-tree"
            if diff -rq "$TMP/local-tree" "$TMP/tag-tree" \
              --exclude=vendor --exclude=node_modules --exclude=tests >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "⏭️ php-connector ${TAG} already matches publishable php/ tree — skipping Packagist sync"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "✅ Will sync php-connector and tag ${TAG}"
      - name: Sync to php-connector repo and tag
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PATCHERLY_RELEASES_TOKEN }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          RELEASE_VER: ${{ inputs.release_ver }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PATCHERLY_RELEASES_TOKEN required to push Patcherly-Official/php-connector"
            exit 1
          fi
          PHP_REPO="Patcherly-Official/php-connector"
          TMP=$(mktemp -d)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${PHP_REPO}.git" "$TMP/repo"
          cd "$TMP/repo"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --exclude=tests/ "$GITHUB_WORKSPACE/php/" .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "⏭️ php-connector main already matches publishable php/ — skipping push"
            exit 0
          fi
          git commit -m "Sync php-connector ${RELEASE_VER}"
          git tag -f "v${RELEASE_VER}"
          git push origin HEAD:main --force
          git push origin "refs/tags/v${RELEASE_VER}" --force
          if [ -n "${PACKAGIST_API_TOKEN:-}" ]; then
            curl -sS -XPOST -H "auth-token: ${PACKAGIST_API_TOKEN}" \
              "https://packagist.org/api/update-package?username=token&repository=${PHP_REPO}" || true
          fi
